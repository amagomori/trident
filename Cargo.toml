[workspace]
resolver = "3"
members = ["crates/term-core", "crates/term-render", "crates/term-app", "vendor/vte"]
default-members = ["crates/term-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/amagomori/trident"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
notify = "8"
term-core = { path = "crates/term-core" }
term-render = { path = "crates/term-render" }
ab_glyph = "0.2"
ab_glyph_rasterizer = "0.1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
libc = "0.2"
memchr = "2"
memmap2 = "0.9"
objc2-core-foundation = "0.3"
objc2-core-text = "0.3"
png = "0.18"
pollster = "0.4"
portable-pty = "0.9"
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "svgz", "raster-images"] }
shlex = "2"
tempfile = "3"
ttf-parser = "0.25"
harfrust = "0.15"
unicode-width = "0.2"
vte = { path = "vendor/vte" }
wgpu = "30"
winit = "0.30"
yeslogic-fontconfig-sys = { version = "6", features = ["dlopen"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
doc_markdown = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
