[workspace]
resolver = "3"
members = ["crates/term-core", "crates/term-render", "crates/term-app"]
default-members = ["crates/term-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/amagomori/terminal"

[workspace.dependencies]
term-core = { path = "crates/term-core" }
term-render = { path = "crates/term-render" }
ab_glyph = "0.2"
ab_glyph_rasterizer = "0.1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
objc2-core-foundation = "0.3"
objc2-core-text = "0.3"
png = "0.18"
pollster = "0.4"
portable-pty = "0.9"
ttf-parser = "0.25"
unicode-width = "0.2"
vte = "0.15"
wgpu = "30"
winit = "0.30"
yeslogic-fontconfig-sys = { version = "6", features = ["dlopen"] }

[profile.release]
lto = "thin"
codegen-units = 1
