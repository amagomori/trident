[package]
name = "term-render"
description = "wgpu renderer, glyph atlas and fonts for terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ab_glyph.workspace = true
ab_glyph_rasterizer.workspace = true
bytemuck.workspace = true
memmap2.workspace = true
png.workspace = true
pollster.workspace = true
term-core.workspace = true
tempfile.workspace = true
unicode-width.workspace = true
ttf-parser.workspace = true
harfrust.workspace = true
wgpu.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
yeslogic-fontconfig-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
glow = "0.17"
x11rb = { version = "0.13", features = ["shm"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-text.workspace = true
