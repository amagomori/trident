[package]
name = "term-app"
description = "A fast, GPU-rendered terminal emulator for macOS and Linux, written in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trident"
path = "src/main.rs"

[dependencies]
serde.workspace = true
toml.workspace = true
notify.workspace = true
arboard.workspace = true
base64.workspace = true
flate2.workspace = true
image = { workspace = true, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
memchr.workspace = true
portable-pty.workspace = true
resvg.workspace = true
shlex.workspace = true
term-core.workspace = true
term-render.workspace = true
winit.workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.2.1", default-features = false, features = ["proxy", "default-rt"] }
futures-lite = "2.6"
notify-rust = { version = "4.19", default-features = false, features = ["z"] }
smithay-clipboard = "0.7.3"
x11rb = { version = "0.13", features = ["present", "dri3"] }
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu.workspace = true
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSBundle", "NSData", "NSGeometry", "NSString", "NSError", "NSUUID", "NSArray", "NSDictionary", "NSValue"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "block2"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLDrawable", "block2", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CABase", "objc2-core-foundation"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }

[lints]
workspace = true
