name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Public API documentation
        run: cargo doc --no-deps -p term-core -p term-render
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Private and application documentation
        run: cargo doc --no-deps --document-private-items -p term-core -p term-render -p term-app
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --doc -p term-core -p term-render
      - run: cargo test --workspace
      - name: Replay tmux image history
        run: |
          if ! command -v tmux >/dev/null; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then brew install tmux; else sudo apt-get install -y tmux; fi
          fi
          cargo test -p term-app --test tmux_image_history -- --ignored
      - run: python3 -m unittest discover -s .github/scripts/merge-queue
      - run: python3 -m unittest discover -s .github/scripts/pgrp-qa
      - run: python3 -m unittest discover -s .github/scripts/release
      - name: term-core has no GPU, window or PTY dependencies
        run: |
          if cargo tree -p term-core -e normal --prefix none | grep -E '^(wgpu|winit|portable-pty|arboard) '; then
            echo "term-core must build headless" >&2
            exit 1
          fi
      - run: cargo build --release --workspace
      - name: PDF viewer with the release PDFium
        run: |
          case "$RUNNER_OS" in
            Linux) platform=linux-x64 ;;
            macOS) platform=mac-universal ;;
          esac
          .github/scripts/release/pdfium.sh "$platform" "$RUNNER_TEMP/pdfium"
          cp "$RUNNER_TEMP"/pdfium/lib/libpdfium.* target/release/
          python3 .github/scripts/release/check_pdf.py target/release/trident
