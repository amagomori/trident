name: Benchmarks

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: benchmark regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Separate target dirs: both checkouts are the same package, and with a shared
          # one Cargo can reuse the base binary for the head build.
          workspaces: |
            head
            base
          key: bench
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Compare against the base branch
        run: python3 head/.github/scripts/bench.py --base base --head head --summary "$GITHUB_STEP_SUMMARY" --json bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench.json
          if-no-files-found: ignore
